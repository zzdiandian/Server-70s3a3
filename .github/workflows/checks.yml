name: Collaboration checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repo.py
      - run: python -m unittest discover -s tests
  compile-stable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py --smoke
  compile-research:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py --research --smoke
  compile-reinforcement-research:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/reinforcement/build.py
      - run: python research/reinforcement/test.py
  compile-fatigue-feedback:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/fatigue/build.py
  compile-worlddrop-research:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/worlddrop/build.py
      - run: python research/worlddrop/test.py
  compile-integrated-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/integration/build.py
      - run: python research/integration/test.py
  compile-tower-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/tower-integration/build.py
      - run: python research/tower-integration/test.py
